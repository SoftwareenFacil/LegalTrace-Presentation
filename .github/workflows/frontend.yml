name: CI/CD frontend

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: legalcont-front
      FILE: 'src/Constants/Url.jsx'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Type Check
        run: npm run tsc -b
        
      - name: Lint
        run: npm run lint
        
      - name: Test Build
        run: npm run build
      
      - name: Modify connection url
        run: |
          echo 'export const BASE_URL = "${{ secrets.BASE_URL }}";' > ${{ env.FILE }}
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
        
      - name: Build Docker Image
        run: docker build -t ${{env.IMAGE_NAME}} .

      - name: Push Docker Image to Registry
        run: |
          docker login -u ${{ secrets.DOCKER_USERNAME }} --password ${{secrets.DOCKER_PASSWORD}}
          docker tag ${{env.IMAGE_NAME}} ${{ secrets.DOCKER_USERNAME }}/${{env.IMAGE_NAME}}:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/${{env.IMAGE_NAME}}:latest
